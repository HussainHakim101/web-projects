<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Constellation lines - Y-shape extending pattern -->
    <line x1="100" y1="180" x2="150" y2="200" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="150" y1="200" x2="200" y2="180" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="200" y1="180" x2="250" y2="220" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="250" y1="220" x2="300" y2="200" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="300" y1="200" x2="350" y2="260" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Lower branch -->
    <line x1="250" y1="220" x2="280" y2="300" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="280" y1="300" x2="220" y2="320" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Major stars - Spica (350,260) is brightest -->
    <circle cx="100" cy="180" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="150" cy="200" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="200" cy="180" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="250" cy="220" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="300" cy="200" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="350" cy="260" r="5" fill="#ffffff" fill-opacity="0.9" filter="url(#starGlow)"/>
    <circle cx="280" cy="300" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="220" cy="320" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <!-- Minor stars -->
    <circle cx="125" cy="190" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="175" cy="190" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="225" cy="200" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="275" cy="210" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="325" cy="230" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="265" cy="260" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="250" cy="310" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>