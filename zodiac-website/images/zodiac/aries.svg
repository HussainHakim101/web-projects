<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Constellation lines -->
    <line x1="120" y1="180" x2="170" y2="160" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="170" y1="160" x2="230" y2="200" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="230" y1="200" x2="280" y2="240" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Major stars -->
    <circle cx="120" cy="180" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="170" cy="160" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="230" cy="200" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="280" cy="240" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <!-- Minor decorative stars -->
    <circle cx="145" cy="168" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="200" cy="182" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="255" cy="222" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="150" cy="210" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="260" cy="190" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="300" cy="260" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="100" cy="200" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>