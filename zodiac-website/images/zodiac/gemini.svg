<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Left twin (Castor) -->
    <line x1="140" y1="100" x2="150" y2="160" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="150" y1="160" x2="160" y2="220" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="220" x2="170" y2="280" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Right twin (Pollux) -->
    <line x1="250" y1="120" x2="260" y2="180" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="260" y1="180" x2="270" y2="240" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="270" y1="240" x2="280" y2="300" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cross connection between twins -->
    <line x1="150" y1="160" x2="200" y2="190" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="200" y1="190" x2="260" y2="180" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="220" x2="270" y2="240" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Major stars - Castor and Pollux brightest -->
    <circle cx="140" cy="100" r="5" fill="#ffffff" fill-opacity="0.9" filter="url(#starGlow)"/>
    <circle cx="250" cy="120" r="5" fill="#ffffff" fill-opacity="0.9" filter="url(#starGlow)"/>
    <circle cx="150" cy="160" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="160" cy="220" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="170" cy="280" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="260" cy="180" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="270" cy="240" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="280" cy="300" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="200" cy="190" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <!-- Minor stars -->
    <circle cx="145" cy="130" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="155" cy="190" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="255" cy="150" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="265" cy="210" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="275" cy="270" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="165" cy="250" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>