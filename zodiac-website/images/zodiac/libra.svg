<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Constellation lines - diamond/kite scales shape -->
    <line x1="150" y1="200" x2="200" y2="140" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="200" y1="140" x2="250" y2="200" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="250" y1="200" x2="200" y2="260" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="200" y1="260" x2="150" y2="200" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Lower scale arms -->
    <line x1="150" y1="200" x2="130" y2="290" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="250" y1="200" x2="270" y2="290" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Major stars -->
    <circle cx="150" cy="200" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="200" cy="140" r="5" fill="#ffffff" fill-opacity="0.9" filter="url(#starGlow)"/>
    <circle cx="250" cy="200" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="200" cy="260" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="130" cy="290" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="270" cy="290" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <!-- Minor stars -->
    <circle cx="175" cy="170" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="225" cy="170" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="175" cy="230" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="225" cy="230" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="140" cy="245" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="260" cy="245" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="200" cy="200" r="2.5" fill="#ffffff" fill-opacity="0.4"/>
  </g>
</svg>