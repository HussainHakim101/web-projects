<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Constellation lines - triangular/arrowhead shape -->
    <line x1="120" y1="180" x2="160" y2="140" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="140" x2="220" y2="150" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="220" y1="150" x2="280" y2="170" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="280" y1="170" x2="300" y2="220" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="300" y1="220" x2="260" y2="260" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="260" y1="260" x2="200" y2="280" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="140" y2="250" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="140" y1="250" x2="120" y2="180" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Major stars -->
    <circle cx="120" cy="180" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="160" cy="140" r="5" fill="#ffffff" fill-opacity="0.9" filter="url(#starGlow)"/>
    <circle cx="220" cy="150" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="280" cy="170" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="300" cy="220" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="260" cy="260" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="200" cy="280" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="140" cy="250" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <!-- Minor stars -->
    <circle cx="140" cy="160" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="190" cy="145" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="250" cy="160" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="290" cy="195" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="280" cy="240" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="230" cy="270" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="170" cy="265" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="130" cy="215" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>