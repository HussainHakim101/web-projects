<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- First fish loop -->
    <line x1="100" y1="200" x2="140" y2="170" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="140" y1="170" x2="180" y2="210" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Connecting cord between fish -->
    <line x1="180" y1="210" x2="220" y2="180" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="220" y1="180" x2="260" y2="230" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Second fish loop -->
    <line x1="260" y1="230" x2="300" y2="200" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="300" y1="200" x2="330" y2="250" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Tail loop down -->
    <line x1="330" y1="250" x2="280" y2="300" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- First fish tail -->
    <line x1="100" y1="200" x2="80" y2="240" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Major stars -->
    <circle cx="100" cy="200" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="140" cy="170" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="180" cy="210" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="220" cy="180" r="5" fill="#ffffff" fill-opacity="0.9" filter="url(#starGlow)"/>
    <circle cx="260" cy="230" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="300" cy="200" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="330" cy="250" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="280" cy="300" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="80" cy="240" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <!-- Minor stars -->
    <circle cx="120" cy="185" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="160" cy="190" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="200" cy="195" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="240" cy="205" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="280" cy="215" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="315" cy="225" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="305" cy="275" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="90" cy="220" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>