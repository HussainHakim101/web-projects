<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Teapot asterism lines -->
    <line x1="120" y1="140" x2="160" y2="180" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="180" x2="200" y2="140" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="200" y1="140" x2="240" y2="200" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="240" y1="200" x2="280" y2="240" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="240" y1="200" x2="220" y2="260" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="220" y1="260" x2="260" y2="300" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="180" x2="220" y2="260" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Spout/arrow line -->
    <line x1="120" y1="140" x2="100" y2="100" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Major stars -->
    <circle cx="120" cy="140" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="160" cy="180" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="200" cy="140" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="240" cy="200" r="5" fill="#ffffff" fill-opacity="0.9" filter="url(#starGlow)"/>
    <circle cx="220" cy="260" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="280" cy="240" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="260" cy="300" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="100" cy="100" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <!-- Minor stars -->
    <circle cx="140" cy="160" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="180" cy="160" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="220" cy="170" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="260" cy="220" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="230" cy="230" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="240" cy="280" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="110" cy="120" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>