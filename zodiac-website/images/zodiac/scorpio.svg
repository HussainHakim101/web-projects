<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Constellation lines - long curved scorpion tail -->
    <line x1="80" y1="160" x2="120" y2="180" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="120" y1="180" x2="160" y2="170" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="170" x2="200" y2="200" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="240" y2="190" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="240" y1="190" x2="280" y2="220" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="280" y1="220" x2="310" y2="260" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="310" y1="260" x2="330" y2="240" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Stinger hook -->
    <line x1="330" y1="240" x2="340" y2="210" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Major stars - Antares (200,200) is brightest -->
    <circle cx="80" cy="160" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="120" cy="180" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="160" cy="170" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="200" cy="200" r="5" fill="#ffffff" fill-opacity="0.9" filter="url(#starGlow)"/>
    <circle cx="240" cy="190" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="280" cy="220" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="310" cy="260" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <circle cx="330" cy="240" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#starGlow)"/>
    <!-- Minor stars -->
    <circle cx="100" cy="170" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="140" cy="175" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="180" cy="185" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="220" cy="195" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="260" cy="205" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="295" cy="240" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="340" cy="210" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="90" cy="145" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>